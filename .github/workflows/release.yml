name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build app bundle
        run: ./scripts/package-macos.sh

      - name: Create tarball
        id: tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          name="gpui-pdf-$VERSION-$TARGET.tar.gz"
          tar -czf "$name" -C dist "GPUI PDF.app"
          shasum -a 256 "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.tarball.outputs.name }}
            ${{ steps.tarball.outputs.name }}.sha256
          if-no-files-found: error

  publish:
    name: publish release and cask
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Update cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          arm_sha=$(cut -d" " -f1 "artifacts/gpui-pdf-$VERSION-aarch64-apple-darwin.tar.gz.sha256")
          intel_sha=$(cut -d" " -f1 "artifacts/gpui-pdf-$VERSION-x86_64-apple-darwin.tar.gz.sha256")
          python3 scripts/update-cask.py "$VERSION" "$arm_sha" "$intel_sha"

      - name: Commit cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if git diff --quiet -- Casks/gpui-pdf.rb; then
            echo "cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gpui-pdf.rb
          git commit -m "feat: publish cask $VERSION"
          git push origin HEAD:main

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*.tar.gz artifacts/*.sha256 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes artifacts/*.tar.gz artifacts/*.sha256
