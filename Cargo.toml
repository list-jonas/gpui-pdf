[workspace]
members = [
    "crates/app",
    "crates/document-core",
    "crates/pdf-engine",
    "crates/pdf-engine-zpdf",
    "crates/persistence",
    "crates/rendering",
    "crates/test-support",
    "crates/ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
chrono = "0.4"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
image = { version = "0.25", default-features = false }
tempfile = "3"
url = "2"
zpdf = { git = "https://github.com/Xero-Team/zpdf", rev = "9537f457b15e22c7c9c21827ec12f254b7644c22", default-features = false, features = ["cpu-render"] }
zpdf-writer = { git = "https://github.com/Xero-Team/zpdf", rev = "9537f457b15e22c7c9c21827ec12f254b7644c22" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.dev]
debug = "limited"

[patch.crates-io]
gpui = { path = "vendor/gpui" }
gpui-component = { path = "vendor/gpui-component" }
